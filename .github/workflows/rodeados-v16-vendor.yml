name: RODEADOS V16 — vendor second humanoid 3D
on:
  pull_request:
    paths:
      - '.github/workflows/rodeados-v16-vendor.yml'
      - 'rodeados-robots-auto.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rodeados-v16-two-androids-wolf-spider
          persist-credentials: true
      - name: Vendor exact published CC BY source GLB
        run: |
          set -euo pipefail
          mkdir -p assets/rodeados
          curl -fLsS --retry 3 --max-time 90 "https://raw.githubusercontent.com/cktang88/3d-fps/130ac2a5c856401ec36e7d35afcfefe40c5801f4/public/assets/models/characters/soldier_tac.glb" -o assets/rodeados/tactical-heavy.glb
          python3 - <<'PY'
          import os,struct
          p='assets/rodeados/tactical-heavy.glb'
          with open(p,'rb') as f: magic,version,size=struct.unpack('<III',f.read(12))
          assert magic==0x46546C67 and version==2 and size==os.path.getsize(p)
          assert 100000<size<8000000
          print('VERIFIED LICENSED SECOND HUMANOID GLB',size)
          PY
      - name: Commit asset into isolated feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rodeados/tactical-heavy.glb
          if ! git diff --cached --quiet; then
            git commit -m "asset(rodeados): second humanoid armored guard GLB, DanlyVostok CC BY"
            git push origin HEAD:feat/rodeados-v16-two-androids-wolf-spider
          fi
