name: Public static arcade (GitHub Pages fallback)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-arcade-pages
  cancel-in-progress: false
jobs:
  build:
    name: Build static arcade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build GitHub Pages path-safe copy
        run: python3 scripts/build-pages.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload arcade artifacts
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    name: Publish public arcade
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
