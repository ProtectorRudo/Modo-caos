name: RODEADOS — GitHub Pages public diagnosis
on:
  pull_request:
    paths:
      - .github/workflows/rodeados-pages-probe.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public Pages URL and GitHub Pages status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "CHECK PAGES BASE"
          for url in https://protectorrudo.github.io/ https://protectorrudo.github.io/Modo-caos/ https://protectorrudo.github.io/Modo-caos/rodeados.html; do
            echo "$url"
            curl -sSL -m 12 -o /tmp/body -w "HTTP=%{http_code} TYPE=%{content_type} BYTES=%{size_download}\n" "$url" || true
            head -c 90 /tmp/body | tr '\n' ' '; echo
          done
          echo "VERIFY NOW-PUBLISHED MIRROR HTTP 200"
          URL="https://protectorrudo.github.io/Modo-caos/rodeados.html"
          HTTP=$(curl -sSL -m 15 -o /tmp/rodeados-mirror.html -w "%{http_code}" "$URL")
          echo "MIRROR_HTTP=$HTTP"
          test "$HTTP" = "200"
          grep -q 'RODEADOS 360' /tmp/rodeados-mirror.html
          for file in rodeados-core.js rodeados-art.js rodeados-ux.js rodeados-runtime.js rodeados-progression.js mc-config.js mc-rooms-client.js; do
            HTTP=$(curl -sSL -m 12 -o /tmp/rodeados-mirror-js -w "%{http_code}" "https://protectorrudo.github.io/Modo-caos/$file")
            echo "$file: $HTTP"
            test "$HTTP" = "200"
          done
          echo "PAGES CONFIG (if enabled)"
          gh api repos/ProtectorRudo/Modo-caos/pages --jq '{status:.status,html_url:.html_url,build_type:.build_type,source:.source}' || true
          echo "LAST PAGES WORKFLOW"
          gh api 'repos/ProtectorRudo/Modo-caos/actions/workflows/publish-pages.yml/runs?per_page=5' --jq '.workflow_runs[] | {id,status,conclusion,html_url,head_sha}' || true
