name: Penales AR regression
on:
  pull_request:
    paths:
      - 'penales*'
      - 'index.html'
      - 'tests/penales.test.cjs'
      - '.github/workflows/penales-tests.yml'
  push:
    paths:
      - 'penales*'
      - 'tests/penales.test.cjs'
      - '.github/workflows/penales-tests.yml'
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check penales-core.js && node --check penales.mjs
      - name: Regression tests
        run: node tests/penales.test.cjs
