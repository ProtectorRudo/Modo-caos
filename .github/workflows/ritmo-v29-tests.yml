name: Ritmo Caos V29 — AR render and vendored DJ GLB checks
on:
  push:
    branches: [feat/ritmo-dj-exterior-20261026]
    paths:
      - 'ritmo-*.js'
      - 'ritmo.html'
      - 'assets/ritmo/**'
      - 'tests/ritmo-*.test.cjs'
      - '.github/workflows/ritmo-v29-tests.yml'
  pull_request:
    paths:
      - 'ritmo-*.js'
      - 'ritmo.html'
      - 'assets/ritmo/**'
      - 'tests/ritmo-*.test.cjs'
      - '.github/workflows/ritmo-v29-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax and isolated DJ 3D tests
        run: |
          node --check ritmo-glb-props.js
          node --check ritmo-exterior.js
          node --check ritmo-stage-showtime.js
          node --check ritmo-runtime.js
          node --test tests/ritmo-glb-v29.test.cjs tests/ritmo-exterior.test.cjs tests/ritmo-prism-v28.test.cjs
