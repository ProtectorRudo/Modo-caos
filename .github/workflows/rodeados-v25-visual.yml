name: RODEADOS V25 - mobile weapon visual proof
on:
  push:
    branches: [fix/rodeados-v25-fps-visible-safe-area]
    paths: ['.github/workflows/rodeados-v25-visual.yml','tests/rodeados-v25-visual.cjs']
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: true}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/rodeados-v25-visual.cjs
      - name: Save verifiable QA screenshot on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/QA/rodeados-v25-fps-mobile.png
          if ! git diff --cached --quiet; then
            git commit -m 'qa(rodeados): visual mobile proof of safely framed PBR gun'
            git push origin HEAD:fix/rodeados-v25-fps-visible-safe-area
          fi
