name: Ritmo V38 - audio onset audit and AR motion tests
on:
  push:
    branches: [feat/ritmo-v38-beat-lock-tracking-20261026]
  pull_request:
    paths: ['ritmo-*.js','scripts/ritmo-audit-beats.py','tests/ritmo-v38-*.test.cjs']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Syntax and V38 motion regressions
        run: |
          node --check ritmo-tracking.js
          node --check ritmo-runtime.js
          node --check ritmo-stage-showtime.js
          node --check ritmo-audio.js
          node --check ritmo-core.js
          node --test tests/ritmo-v38-tracking.test.cjs tests/ritmo-v38-beat.test.cjs tests/ritmo-v37-visible.test.cjs
      - name: Install self-contained Opus decoder
        run: python3 -m pip install --user imageio-ffmpeg==0.6.0
      - name: Measure recording beats against chart timestamps
        run: python3 scripts/ritmo-audit-beats.py
