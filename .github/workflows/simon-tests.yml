name: SIMON TRAICIONERO — game QA
on:
  push:
    branches: ['feat/simon-traicionero-ar', main]
    paths: ['simon*', 'tests/simon*', 'engine.js', 'index.html', 'salas.html', 'mc-lobby.js', '.github/workflows/simon-tests.yml']
  pull_request:
    paths: ['simon*', 'tests/simon*', 'engine.js', 'index.html', 'salas.html', 'mc-lobby.js']
permissions:
  contents: read
jobs:
  core-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: node --check simon-core.js
      - run: node --check simon-art.js
      - run: node --check simon-runtime.js
      - run: node --check engine.js
      - run: node --test tests/simon.test.cjs
