name: RODEADOS — vendor verified free tactical robot asset
on:
  pull_request:
    paths:
      - .github/workflows/rodeados-vendor-robot.yml
  push:
    branches: [feat/rodeados-auto-robots-v14]
    paths:
      - .github/workflows/rodeados-vendor-robot.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/rodeados-auto-robots-v14
      - name: Download original rigged 3D model (CC BY 4.0)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/rodeados
          URL="https://raw.githubusercontent.com/cktang88/3d-fps/130ac2a5c856401ec36e7d35afcfefe40c5801f4/public/assets/models/characters/soldier.glb"
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 "$URL" -o assets/rodeados/tactical-android.glb
          python3 - <<'PY'
          import os,struct
          f="assets/rodeados/tactical-android.glb"
          with open(f,"rb") as inp: magic,version,declared=struct.unpack("<III",inp.read(12))
          size=os.path.getsize(f)
          assert magic==0x46546C67 and version==2 and declared==size
          assert 100000<size<8000000, (size,"unexpected glTF size")
          print("VALID RIGGED GLB",size,"bytes, glTF v",version)
          PY
      - name: Commit binary to project without CDN runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rodeados/tactical-android.glb
          if ! git diff --cached --quiet; then
            git commit -m "asset(rodeados): vendor rigged 3D tactical character from CC BY 4.0 source"
            git push origin HEAD:feat/rodeados-auto-robots-v14
          fi
