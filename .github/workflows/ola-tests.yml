name: Ola Roja — core y regresión
on:
  push:
    branches: [main, feat/ola-roja-ar, fix/ola-roja-premium-final]
    paths:
      - 'ola-*'
      - 'ola.html'
      - 'index.html'
      - 'engine.js'
      - 'tests/ola.test.cjs'
      - 'tests/ola-browser.test.cjs'
      - 'tests/ola-xr-smoke.test.cjs'
      - 'tests/ola-public.test.cjs'
      - '.github/workflows/ola-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Sintaxis
        run: |
          for f in ola-core.js ola-art.js ola-runtime.js; do node --check "$f"; done
      - name: Ola Roja core
        run: node tests/ola.test.cjs
      - name: Regresión de núcleos existentes
        run: |
          node tests/semaforo.test.cjs
          node tests/semaforo-motion.test.cjs
          node tests/meteoros.test.cjs
          node tests/rodeados.test.cjs
          node tests/rodeados-bomb.test.cjs

  browser:
    name: Ola Roja · Chromium Android 2D
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Instalar navegador de pruebas
        run: |
          npm install --ignore-scripts --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Ejercitar juego real en navegador
        run: |
          node tests/ola-browser.test.cjs
          node tests/ola-xr-smoke.test.cjs
      - name: Confirmar vista pública alternativa HTTPS (no producción)
        continue-on-error: true
        run: node tests/ola-public.test.cjs
