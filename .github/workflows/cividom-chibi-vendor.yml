name: CIVIDOM - vendor 5 original Styloo chibi GLBs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cividom-chibi-vendor.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cividom-chibi-vendor
  cancel-in-progress: false
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9f683 # v4.2.2
        with:
          ref: main
          persist-credentials: true
      - name: Vendor exact original 5 Styloo CC0 animated Chibi GLBs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/styloo
          ROOT='https://raw.githubusercontent.com/binyoun-cberi/kidscade/a68ea8ac843db770e24172d3319ac6cd07bec97a/assets/game/chibi/ChibiCharactersV1.2/ChibiCharacters/glb'
          for name in ninja archer student merchant knight; do
            curl -fLsS --retry 4 --connect-timeout 20 --max-time 240 "$ROOT/${name}pr.glb" -o "assets/styloo/${name}.glb"
          done
          python3 - <<'PY'
          import json, pathlib, struct, hashlib
          base=pathlib.Path('assets/styloo')
          names=['ninja','archer','student','merchant','knight']
          manifest={'author':'Styloo','license':'CC0-1.0','source':'https://styloo.itch.io/chibi','mirror':'https://github.com/binyoun-cberi/kidscade/tree/a68ea8ac843db770e24172d3319ac6cd07bec97a/assets/game/chibi/ChibiCharactersV1.2/ChibiCharacters/glb','models':{}}
          for name in names:
            data=(base/(name+'.glb')).read_bytes()
            magic,version,size=struct.unpack_from('<III',data,0)
            assert magic==0x46546C67 and version==2 and size==len(data)
            assert 100000<len(data)<20000000
            manifest['models'][name]={'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (base/'manifest.json').write_text(json.dumps(manifest,indent=2))
          (base/'LICENSE.txt').write_text('Styloo Chibi Characters, CC0 1.0 Universal.\\nAuthor: https://styloo.itch.io/chibi\\nhttps://creativecommons.org/publicdomain/zero/1.0/\\n')
          print('ALL 5 RIGGED STYLOO CHIBIS VERIFIED',manifest)
          PY
      - name: Commit first-party static assets for fast mobile loads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/styloo
          if ! git diff --cached --quiet; then
            git commit -m 'assets(cividom): five licensed chibi GLBs from Styloo'
            git push origin HEAD:main
          fi
