name: CIVIDOM - install licensed Styloo chibi champions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cividom-chibi-vendor.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cividom-chibi-vendor
  cancel-in-progress: false
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9f683 # v4.2.2
        with:
          ref: main
          persist-credentials: true
      - name: Download Styloo CC0 Chibi Characters from official Godot Asset Store
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 4 --connect-timeout 20 --max-time 250 \
            -A 'CIVIDOM-CC0-asset-vendor/1.0' \
            'https://store.godotengine.org/asset/styloo/chibi/download/1373/' \
            -o /tmp/cividom-styloo.zip
          python3 - <<'PY'
          import os, zipfile, struct, json, hashlib, re, pathlib
          src='/tmp/cividom-styloo.zip'
          assert zipfile.is_zipfile(src), 'Official archive not ZIP'
          goal=['ninja','archer','student','merchant','knight']
          out=pathlib.Path('assets/styloo');out.mkdir(parents=True,exist_ok=True)
          manifest={'source':'https://store.godotengine.org/asset/styloo/chibi/','license':'CC0-1.0','author':'Styloo','characters':{}}
          with zipfile.ZipFile(src) as z:
            models=[p for p in z.namelist() if p.lower().endswith('.glb') and not p.startswith('__MACOSX')]
            print('GLB candidates:',models[:100])
            assert len(models)>=5,'Official zip missing 5 GLBs'
            for name in goal:
              matches=[p for p in models if re.search(r'(^|[^a-z])'+name+r'([^a-z]|$)',p.lower())]
              assert matches, f'No official {name} GLB'
              matches.sort(key=lambda p:(('allinone' in p.lower())+('all_in_one' in p.lower()),-p.count('/'),len(p)),reverse=True)
              selected=matches[0]
              data=z.read(selected)
              assert len(data)>10000 and len(data)<35000000, f'Unexpected asset size {name}'
              magic,version,declared=struct.unpack_from('<III',data)
              assert magic==0x46546c67 and version==2 and declared==len(data), f'Invalid GLB {name}'
              (out/(name+'.glb')).write_bytes(data)
              manifest['characters'][name]={'archive_path':selected,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          (out/'LICENSE.txt').write_text('Styloo Chibi Characters (https://styloo.itch.io/chibi)\\nCC0 1.0 Universal https://creativecommons.org/publicdomain/zero/1.0/\\nOriginal model files with original author credit preserved.\\n')
          print('VERIFIED:',manifest['characters'])
          PY
      - name: Commit the verified static models to repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/styloo
          if ! git diff --cached --quiet; then
            git commit -m 'assets(cividom): vendor 5 authentic Styloo CC0 animated chibi GLBs'
            git push origin HEAD:main
          fi
