name: RODEADOS V26 — large rifle on-screen acceptance
on:
  push:
    branches: [feat/rodeados-v26-rifle-screen-space]
    paths:
      - 'rodeados-*.js'
      - 'rodeados.html'
      - 'tests/rodeados*'
      - 'assets/rodeados/player-pbr-rifle.glb'
      - '.github/workflows/rodeados-v26-qa.yml'
permissions: {contents: write}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: true}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: node --check rodeados-art.js && node --check rodeados-ar-compositor.js && node --check rodeados-runtime.js && node --check rodeados-robots-auto.js
      - run: node --test tests/rodeados-v18-missions.test.cjs tests/rodeados-v17.test.cjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: RODEADOS_REAL_ASSET=1 node tests/rodeados-auto-robots.test.cjs
      - run: node tests/rodeados-xr-smoke.test.cjs
      - run: node tests/rodeados-v19-xr-tactical.test.cjs
      - run: node tests/rodeados-v25-visual.cjs
      - name: Persist actual mobile screenshot to preview branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/QA/rodeados-v26-rifle-mobile.png
          if ! git diff --cached --quiet; then
            git commit -m 'qa(v26): mobile screenshot of realistic rifle'
            git push origin HEAD:feat/rodeados-v26-rifle-screen-space
          fi
