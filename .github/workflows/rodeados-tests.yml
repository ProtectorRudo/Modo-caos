name: RODEADOS 360 — core and syntax QA
on:
  push:
    branches: ['feat/rodeados-360', main]
    paths: ['rodeados-*', 'tests/rodeados*', '.github/workflows/rodeados-tests.yml', 'index.html', 'salas.html', 'mc-lobby.js']
  pull_request:
    paths: ['rodeados-*', 'tests/rodeados*', '.github/workflows/rodeados-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: node --check rodeados-core.js
      - run: node --check rodeados-ux.js
      - run: node --check rodeados-progression.js
      - run: node --check rodeados-art.js
      - run: node --check rodeados-runtime.js
      - run: node --test tests/rodeados.test.cjs
      - run: node --test tests/rodeados-ux.test.cjs
      - run: node --test tests/rodeados-coop.test.cjs
      - run: node --test tests/rodeados-combat-v6.test.cjs
      - run: node --test tests/rodeados-progression.test.cjs
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: npm install --ignore-scripts --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/rodeados-browser.test.cjs
      - run: node tests/rodeados-xr-smoke.test.cjs
