name: CIVIDOM real-browser mobile smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cividom-browser-qa.yml'
      - 'scripts/cividom-browser-smoke.mjs'
      - 'paper.html'
      - 'paper-3d.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned browser engine
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run CIVIDOM mobile simulation
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/cividom-local.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node scripts/cividom-browser-smoke.mjs --2d
          node scripts/cividom-browser-smoke.mjs
      - name: Upload screenshot, samples and browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cividom-mobile-browser-audit
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
