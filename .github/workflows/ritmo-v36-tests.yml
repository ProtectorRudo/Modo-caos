name: Ritmo V36 — immersive stage geometry and gameplay safety
on:
  push:
    branches: [feat/ritmo-v36-stage-layout-20261026]
    paths: ['ritmo-*.js','ritmo.html','tests/ritmo-stage-v36.test.cjs','.github/workflows/ritmo-v36-tests.yml']
  pull_request:
    paths: ['ritmo-exterior.js','ritmo.html','tests/ritmo-stage-v36.test.cjs']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Check JavaScript syntax
        run: |
          node --check ritmo-glb-props.js
          node --check ritmo-exterior.js
          node --check ritmo-stage-showtime.js
          node --check ritmo-core.js
          node --check ritmo-runtime.js
      - name: Verify stage geometry and gameplay regressions
        run: |
          node --test tests/ritmo-stage-v36.test.cjs tests/ritmo-exterior.test.cjs tests/ritmo-audio.test.cjs
