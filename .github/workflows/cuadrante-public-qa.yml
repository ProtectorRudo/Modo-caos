name: CUADRANTE · verify public playable URL
on:
  pull_request:
    paths:
      - '.github/workflows/cuadrante-public-qa.yml'
  push:
    branches: [test/cuadrante-public-availability]
    paths:
      - '.github/workflows/cuadrante-public-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-https:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check GitHub Pages, GitHack, rawcdn and Vercel from public internet
        run: |
          node --input-type=module <<'NODE'
          const sha='048361d219fae1a5dc319f2a4174c686910619f9';
          const urls=[
           'https://protectorrudo.github.io/Modo-caos/cuadrante.html',
           'https://raw.githack.com/ProtectorRudo/Modo-caos/'+sha+'/cuadrante.html',
           'https://rawcdn.githack.com/ProtectorRudo/Modo-caos/'+sha+'/cuadrante.html',
           'https://modo-caos-eta.vercel.app/cuadrante.html'
          ];
          let pass=0;
          await Promise.all(urls.map(async url=>{
            try{
              const r=await fetch(url,{signal:AbortSignal.timeout(20000)});
              const html=await r.text();
              const type=r.headers.get('content-type')||'';
              const valid=r.ok&&type.includes('text/html')&&html.includes('CUADRANTE')&&html.includes('cuadrante-runtime.js');
              const jsurl=new URL('./cuadrante-runtime.js',url);
              const js=valid?await fetch(jsurl,{signal:AbortSignal.timeout(20000)}):null;
              const playable=valid&&js?.ok&&(js.headers.get('content-type')||'').includes('javascript');
              console.log(JSON.stringify({url,status:r.status,contentType:type,bytes:html.length,jsStatus:js?.status,jsMime:js?.headers.get('content-type'),playable}));
              if(playable)pass++;
            }catch(e){console.log(JSON.stringify({url,error:String(e)}))}
          }));
          console.log('Public HTTPS sources with playable HTML & JS:',pass);
          if(pass===0)process.exitCode=1;
          NODE
      - name: Launch public CUADRANTE in real Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:960,height:520}});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          const site='https://rawcdn.githack.com/ProtectorRudo/Modo-caos/048361d219fae1a5dc319f2a4174c686910619f9/cuadrante.html';
          const resp=await page.goto(site,{waitUntil:'domcontentloaded',timeout:30000});
          if(!resp.ok())throw Error('Bad HTTP '+resp.status());
          await page.locator('#startDemo').click();
          await page.locator('#stage canvas').waitFor({state:'visible',timeout:40000});
          await page.locator('#pauseBtn').click();
          await page.locator('#modalTitle').textContent().then(x=>{if(x!=='PAUSA')throw Error('Pause broken: '+x)});
          await page.getByRole('button',{name:'CONTINUAR'}).click();
          await page.locator('#exitBtn').click();
          await page.locator('#home').waitFor({state:'visible'});
          if(errors.length)throw Error('Uncaught browser errors: '+errors.join(';'));
          console.log('PASS: publicly served game actually starts, renders 3D, pauses, resumes and exits in Chromium');
          await browser.close();
          NODE
