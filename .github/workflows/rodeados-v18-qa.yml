name: RODEADOS V19 — tactical AR placement and seven-mode QA
on:
  push:
    branches: [feat/rodeados-seven-missions-v18]
    paths:
      - 'rodeados-*.js'
      - 'rodeados.html'
      - 'tests/rodeados*'
      - '.github/workflows/rodeados-v18-qa.yml'
  pull_request:
    paths:
      - 'rodeados-*.js'
      - 'rodeados.html'
      - 'tests/rodeados*'
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: node --check rodeados-missions.js && node --check rodeados-flag-planner.js && node --check rodeados-mission-art.js && node --check rodeados-runtime.js
      - run: node --test tests/rodeados-v18-missions.test.cjs
      - run: node --test tests/rodeados.test.cjs tests/rodeados-v17.test.cjs tests/rodeados-bomb.test.cjs tests/rodeados-spider-v16.test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm install --ignore-scripts --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/rodeados-browser.test.cjs
      - run: node tests/rodeados-xr-smoke.test.cjs
      - run: node tests/rodeados-v18-browser.test.cjs
      - run: node tests/rodeados-v19-xr-tactical.test.cjs
