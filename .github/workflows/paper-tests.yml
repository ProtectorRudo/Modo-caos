name: Paper Arcade QA
on:
  push:
    branches: [main]
    paths:
      - 'paper.html'
      - 'paper-3d.mjs'
      - 'tests/paper-game.test.cjs'
      - '.github/workflows/paper-tests.yml'
  pull_request:
    paths:
      - 'paper.html'
      - 'paper-3d.mjs'
      - 'tests/paper-game.test.cjs'
      - '.github/workflows/paper-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate ES module and standalone game syntax
        run: |
          node --check paper-3d.mjs
          node --check tests/paper-game.test.cjs
      - name: Validate territory game mechanics
        run: node --test tests/paper-game.test.cjs
