name: Ritmo Caos V31 Horse DJ — full visual regression
on:
  push:
    branches: [feat/ritmo-v31-horse-dj-20261026]
    paths:
      - 'ritmo-*.js'
      - 'ritmo.html'
      - 'assets/ritmo/**'
      - 'tests/ritmo-*.test.cjs'
      - '.github/workflows/ritmo-v31-tests.yml'
  pull_request:
    paths:
      - 'ritmo-*.js'
      - 'ritmo.html'
      - 'assets/ritmo/**'
      - 'tests/ritmo-*.test.cjs'
      - '.github/workflows/ritmo-v31-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Validate all Ritmo JavaScript modules
        run: |
          node --check ritmo-glb-props.js
          node --check ritmo-exterior.js
          node --check ritmo-stage-showtime.js
          node --check ritmo-runtime.js
      - name: GLB Quaternius and CC0 stage plus regressions
        run: |
          node --test tests/ritmo-horse-dj-v31.test.cjs tests/ritmo-festival-v30.test.cjs tests/ritmo-glb-v29.test.cjs tests/ritmo-exterior.test.cjs tests/ritmo-floor-flow-v29.test.cjs tests/ritmo-prism-v28.test.cjs
          node -e "global.window=globalThis; require('./tests/ritmo-impact-alignment.test.cjs')"
