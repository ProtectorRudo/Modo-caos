name: CUADRANTE · core and standalone static QA
on:
  push:
    branches: [main, feature/cuadrante-20261025]
    paths:
      - 'cuadrante*'
      - 'tests/cuadrante*'
      - '.github/workflows/cuadrante-qa.yml'
  pull_request:
    paths:
      - 'cuadrante*'
      - 'tests/cuadrante*'
      - '.github/workflows/cuadrante-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-simulations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: JavaScript syntax check
        run: |
          node --check cuadrante-core.js
          node --check cuadrante-art.js
          node --check cuadrante-lite.js
          node --check cuadrante-premium.js
          node --input-type=module --check <cuadrante-ar-compositor.js
          node --check cuadrante-runtime.js
      - name: Physics, scoring, progression and survival
        run: node tests/cuadrante-core.test.cjs
      - name: Verify licensed local 3D models, audio and PBR maps
        run: python3 tests/cuadrante-assets.test.py
      - name: Check assets and links
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('cuadrante.html','utf8');
          for(const x of ['cuadrante-core.js','cuadrante-art.js','cuadrante-premium.js','cuadrante-lite.js','cuadrante-runtime.js']){
            if(!html.includes('src="./'+x+'"'))throw Error('missing '+x);
          }
          const home=fs.readFileSync('index.html','utf8');
          if(!home.includes('href="/cuadrante.html"'))throw Error('missing menu card');
          console.log('PASS: static arcade integration');
          NODE
      - name: Install browser test runner and Chromium
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install chromium --with-deps
      - name: Run Chromium WebGL gameplay smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cuadrante-http.log 2>&1 &
          sleep 2
          npx playwright test tests/cuadrante-*.spec.cjs --reporter=line
        env:
          CI: true
      - name: Probe public HTTPS CDN for deployment fallback
        if: always()
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const sha=process.env.SOURCE_SHA;
          for(const host of ['raw.githack.com','rawcdn.githack.com']){
            const base='https://'+host+'/ProtectorRudo/Modo-caos/'+sha+'/';
            for(const file of ['cuadrante.html','cuadrante-runtime.js']){
              try{
                const res=await fetch(base+file,{signal:AbortSignal.timeout(15000)});
                const body=await res.text();
                console.log(base+file,'status',res.status,'mime',res.headers.get('content-type'),'bytes',body.length,'valid',body.includes('CUADRANTE'));
              }catch(e){console.log(base+file,e.message)}
            }
          }
          NODE
