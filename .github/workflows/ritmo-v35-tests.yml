name: Ritmo V35 — real on-deck horse DJ and visual regression
on:
  push:
    branches: [feat/ritmo-v35-visible-dj-mix-20261026]
    paths: ['ritmo-*.js','ritmo.html','tests/ritmo-*.test.cjs','.github/workflows/ritmo-v35-tests.yml']
  pull_request:
    paths: ['ritmo-*.js','ritmo.html','tests/ritmo-*.test.cjs','.github/workflows/ritmo-v35-tests.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Syntax check
        run: |
          node --check ritmo-core.js
          node --check ritmo-engine.js
          node --check ritmo-runtime.js
          node --check ritmo-glb-props.js
          node --check ritmo-skinning.js
          node --check ritmo-exterior.js
          node --check ritmo-stage-showtime.js
      - name: Verify V35 wrists and stage + V28–V34 regressions
        run: |
          node --test \
            tests/ritmo-visible-v35.test.cjs \
            tests/ritmo-dj-live-v34.test.cjs \
            tests/ritmo-dj-v34.test.cjs \
            tests/ritmo-v34-live-dj.test.cjs \
            tests/ritmo-live-v34.test.cjs \
            tests/ritmo-ik-v34.test.cjs \
            tests/ritmo-skinning-v33.test.cjs \
            tests/ritmo-stage-v32.test.cjs \
            tests/ritmo-horse-dj-v31.test.cjs \
            tests/ritmo-festival-v30.test.cjs \
            tests/ritmo-glb-v29.test.cjs \
            tests/ritmo-exterior.test.cjs \
            tests/ritmo-floor-flow-v29.test.cjs \
            tests/ritmo-prism-v28.test.cjs
          node -e "global.window=globalThis; require('./tests/ritmo-impact-alignment.test.cjs')"
